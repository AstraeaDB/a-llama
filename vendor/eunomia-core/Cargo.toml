# Vendored snapshot of eunomia-core (default `hnsw_rs` backend only).
# Source: AstraeaDB/astraea-development -> projects/eunomia/crates/eunomia-core
# @ a932d76, vendored 2026-06-18. Re-sync from the source if eunomia-core changes.
[package]
name = "eunomia-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Eunomia's independent working-memory engine: data model, storage, query planner, and persistence. No AstraeaDB dependency."

[features]
default = []
# Declared only so the cfg gates in src/vector.rs are recognized. The optional
# astraea-vector backend is NOT vendored, so enabling this feature will not
# compile here — a-llama uses the default hnsw_rs backend.
vector-astraea = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
hnsw_rs = "0.3"
crc32fast = "1"
